[component.gui-apps]
title = "GUI apps (platform file)"
[component.os-defaults]
title = "OS settings (platform file)"
[component.dotfiles]
title = "Dotfiles and git identity"

# ---------------------------------------------------------------- presets: only pre-tick; the user can change everything
[preset.full]
components = ["*"]
[preset.minimal]
components = ["core", "shell", "dotfiles"]
[preset.server]
components = ["core", "shell", "python", "node", "rust", "bun", "containers", "native-build", "dotfiles"]
[preset.custom]
components = []

# ---------------------------------------------------------------- choices shared by all OSes
# type: one (options), many (options), bool, text. default_by_os overrides default.
[[choice]]
id = "node-line"
component = "node"
label = "Node.js line"
type = "one"
options = ["lts", "current"]
default = "lts"

[[choice]]
id = "rust-targets"
component = "rust"
label = "Extra Rust cross-compile targets"
type = "many"
options = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-pc-windows-msvc", "x86_64-pc-windows-msvc", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
default = []

[[choice]]
id = "git-name"
component = "dotfiles"
label = "git user.name (empty = keep the existing value)"
type = "text"
default = ""

[[choice]]
id = "git-email"
component = "dotfiles"
label = "git user.email (empty = keep the existing value)"
type = "text"
default = ""

[[choice]]
id = "dotfile-gitconfig"
component = "dotfiles"
label = "dotfiles/common/gitconfig"
type = "one"
options = ["link", "copy", "skip"]
default = "link"
default_by_os = { windows = "copy" }

[[choice]]
id = "dotfile-zshenv"
component = "dotfiles"
os = ["macos", "linux"]
label = "dotfiles/unix/zshenv"
type = "one"
options = ["link", "copy", "skip"]
default = "link"

[[choice]]
id = "dotfile-zshrc"
component = "dotfiles"
os = ["macos", "linux"]
label = "dotfiles/unix/zshrc"
type = "one"
options = ["link", "copy", "skip"]
default = "link"

[[choice]]
id = "dotfile-profile"
component = "dotfiles"
os = ["windows"]
label = "dotfiles/windows/profile.ps1 (dot-sourced from $PROFILE)"
type = "one"
options = ["link", "copy", "skip"]
default = "copy"
