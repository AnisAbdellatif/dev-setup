title = "Core CLI"
[component.shell]
title = "Shell tools"
[component.shell-extras]
title = "Shell extras (zsh, oh-my-zsh, plugins)"
[component.python]
title = "Python (uv)"
[component.node]
title = "Node.js"
[component.bun]
title = "Bun"
[component.deno]
title = "Deno"
[component.rust]
title = "Rust"
[component.go]
title = "Go"
[component.java]
title = "Java"
[component.ruby]
title = "Ruby and Kamal"
[component.containers]
title = "Containers"
[component.native-build]
title = "Native build tools"
[component.version-managers]
title = "Version managers"
[component.docs]
title = "Docs and diagrams"
[component.reverse-eng]
title = "Reverse engineering"
[component.extras]
