# ---------------------------------------------------------------- OS settings (each a separate choice, default off)
[[choice]]
id = "macos-key-repeat"
component = "os-defaults"
label = "Fast key repeat"
type = "bool"
default = false
apply = "defaults write -g KeyRepeat -int 2 && defaults write -g InitialKeyRepeat -int 15"
[[choice]]
id = "macos-finder-extensions"
component = "os-defaults"
label = "Finder: show all file extensions"
type = "bool"
default = false
apply = "defaults write NSGlobalDomain AppleShowAllExtensions -bool true && killall Finder"
[[choice]]
id = "macos-dock-autohide"
component = "os-defaults"
label = "Dock: auto-hide"
type = "bool"
default = false
apply = "defaults write com.apple.dock autohide -bool true && killall Dock"
